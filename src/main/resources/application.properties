# Payroll Data Quality Pipeline - Default Configuration
#
# Loaded from the classpath as "application.properties" by PayrollPipelineConfig
# (see loadPropertiesWithHierarchy()). Every key below is one PayrollPipelineConfig
# actually reads - check that class for the full key list and built-in defaults
# before adding new ones here, since unrecognized keys are silently ignored.
#
# Values here are tuned for the docker-compose environment in this repo (Kafka on
# the "kafka" host, MinIO as the S3 endpoint, the Iceberg REST catalog service).
#
# Override order (highest wins): --key=value CLI args > PAYROLL_* env vars >
# -Dpayroll.config.file=<path> external file > this file > built-in defaults.

# ===================================================================
# APPLICATION
# ===================================================================
payroll.application.name=payroll-data-quality-pipeline
payroll.application.version=1.0.0

# ===================================================================
# KAFKA
# ===================================================================
payroll.kafka.bootstrap.servers=kafka:29092
payroll.kafka.schema.registry.url=http://schema-registry:8081
payroll.kafka.topics=payroll-employees
payroll.kafka.consumer.group=flink-payroll-pipeline
payroll.kafka.exactly.once.enabled=true
payroll.kafka.consumer.timeout=30

# Topic that validated records are published to.
kafka.topic.payroll.valid=payroll-valid-employees

# ===================================================================
# ICEBERG DATA LAKE
# ===================================================================
# PayrollIcebergSinkConnector only supports a REST catalog today; this points at
# the "rest" service (tabulario/iceberg-rest) in docker-compose.yml. Leaving
# payroll.iceberg.rest.uri unset makes the pipeline fall back to an unconfigured
# Hadoop-style catalog pointed at /etc/hadoop/conf, which does not exist in the
# Flink image and will not work in this environment.
payroll.iceberg.rest.uri=http://rest:8181
payroll.iceberg.catalog.name=payroll_catalog
payroll.iceberg.warehouse.path=s3a://warehouse/payroll
payroll.iceberg.audit.warehouse.path=s3a://warehouse/audit
payroll.iceberg.compaction.enabled=true
payroll.iceberg.compaction.interval.minutes=30

# S3 (MinIO) credentials used by the Iceberg catalog and S3FileIO. Match the
# minio/mc service definitions in docker-compose.yml.
aws.s3.endpoint=http://minio:9000
aws.s3.path-style-access=true
aws.access.key.id=admin
aws.secret.access.key=password
aws.region=us-east-1

# ===================================================================
# VALIDATION
# ===================================================================
payroll.validation.duplicate.detection.enabled=true
payroll.validation.duplicate.window.minutes=60
payroll.validation.compliance.auditing.enabled=true
payroll.validation.strict.mode.enabled=false

# ===================================================================
# HR WORKFLOW ROUTING
# ===================================================================
payroll.hr.sla.threshold.hours=4
payroll.hr.max.retry.attempts=3
payroll.hr.load.balancing.enabled=true
payroll.hr.escalation.enabled=true
payroll.hr.escalation.threshold.hours=6

# ===================================================================
# SECURITY / PII
# ===================================================================
# Left disabled by default: turning this on requires real key management
# (see PayrollSecurityManager) which this repo does not configure yet.
payroll.security.pii.encryption.enabled=false
payroll.security.ssl.enabled=false
payroll.security.authentication.enabled=false

# ===================================================================
# CHECKPOINTING / STATE
# ===================================================================
# Must point inside the volumes docker-compose mounts into the Flink containers:
# flink-checkpoints -> /checkpoints, flink-savepoints -> /savepoints.
payroll.checkpoint.enabled=true
payroll.checkpoint.interval=10000
payroll.checkpoint.min.pause=5000
payroll.checkpoint.timeout=600000
payroll.checkpoint.storage.path=file:///checkpoints

payroll.state.backend=rocksdb
payroll.state.storage.path=file:///checkpoints/state
payroll.state.incremental.checkpoints=true

# ===================================================================
# EXECUTION
# ===================================================================
payroll.execution.parallelism=4
payroll.execution.max.parallelism=128
payroll.execution.buffer.timeout=100
payroll.execution.time.characteristic=EVENT_TIME

# ===================================================================
# METRICS
# ===================================================================
payroll.metrics.enabled=true
payroll.metrics.reporter=slf4j
payroll.metrics.interval.seconds=60

# ===================================================================
# HEALTH CHECKS
# ===================================================================
# This server starts inside whichever process calls PayrollDataQualityPipeline.main()
# - the JobManager container, when launched via `flink run`. Flink's own REST API
# already owns port 8080 there, so this must NOT default to 8080. See the
# flink-jobmanager port mapping in docker-compose.yml for the published host port.
payroll.health.enabled=true
payroll.health.port=8090
payroll.health.endpoint=/health
payroll.health.check.interval.seconds=30
