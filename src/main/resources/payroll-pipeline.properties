# Payroll Data Quality Pipeline Configuration
# This configuration file contains all settings for the real-time payroll validation pipeline

# ===================================================================
# PIPELINE IDENTIFICATION
# ===================================================================
pipeline.name=payroll-data-quality-pipeline
pipeline.version=1.0.0
pipeline.description=Real-time payroll data validation and quality assurance pipeline

# ===================================================================
# KAFKA CONFIGURATION
# ===================================================================
# Kafka cluster connection
kafka.bootstrap.servers=localhost:9092
kafka.security.protocol=PLAINTEXT
kafka.retries=3
kafka.batch.size=16384
kafka.linger.ms=5
kafka.buffer.memory=33554432

# Consumer configuration
kafka.consumer.group.id=payroll-pipeline-consumer
kafka.consumer.auto.offset.reset=earliest
kafka.consumer.enable.auto.commit=false
kafka.consumer.max.poll.records=1000
kafka.consumer.session.timeout.ms=30000
kafka.consumer.fetch.min.bytes=1024
kafka.consumer.fetch.max.wait.ms=500

# Producer configuration
kafka.producer.acks=all
kafka.producer.compression.type=snappy
kafka.producer.max.in.flight.requests.per.connection=1
kafka.producer.enable.idempotence=true

# ===================================================================
# KAFKA TOPICS
# ===================================================================
# Input topic for payroll employee records
kafka.topic.payroll.input=payroll-employees
kafka.topic.payroll.input.partitions=6
kafka.topic.payroll.input.replication.factor=1

# Output topic for validated payroll records (routed to Iceberg)
kafka.topic.payroll.valid=payroll-valid-employees
kafka.topic.payroll.valid.partitions=6
kafka.topic.payroll.valid.replication.factor=1

# HR failure topic for invalid records requiring correction
kafka.topic.hr.failures=hr-payroll-failures
kafka.topic.hr.failures.partitions=3
kafka.topic.hr.failures.replication.factor=1

# Compliance audit topic for PII access tracking
kafka.topic.compliance.audit=compliance-audit-trail
kafka.topic.compliance.audit.partitions=2
kafka.topic.compliance.audit.replication.factor=1

# Dead letter topic for processing failures
kafka.topic.deadletter=payroll-deadletter
kafka.topic.deadletter.partitions=1
kafka.topic.deadletter.replication.factor=1

# ===================================================================
# AVRO SCHEMA REGISTRY
# ===================================================================
schema.registry.url=http://localhost:8081
schema.registry.basic.auth.user.info=
schema.registry.basic.auth.credentials.source=USER_INFO

# Schema configuration
schema.payroll.employee.subject=payroll-employee-value
schema.payroll.employee.version=latest
schema.failed.record.subject=failed-payroll-record-value
schema.failed.record.version=latest
schema.compatibility.level=BACKWARD

# ===================================================================
# ICEBERG DATA LAKE CONFIGURATION
# ===================================================================
# S3 configuration for Iceberg tables
iceberg.catalog.type=hadoop
iceberg.catalog.warehouse=s3a://payroll-data-lake/
iceberg.catalog.uri=thrift://localhost:9083

# S3 credentials (use IAM roles in production)
aws.access.key.id=test
aws.secret.access.key=test
aws.region=us-east-1
aws.s3.endpoint=http://localhost:4566

# Iceberg table settings
iceberg.table.payroll.validated=payroll_data_lake.validated_employees
iceberg.table.compliance.audit=payroll_data_lake.compliance_audit_log
iceberg.table.quality.metrics=payroll_data_lake.quality_metrics_summary

# Write configuration
iceberg.write.format=parquet
iceberg.write.compression=zstd
iceberg.write.target.file.size.bytes=134217728
iceberg.write.upsert.enabled=false

# ===================================================================
# PAYROLL VALIDATION RULES
# ===================================================================
# Data quality rules configuration
validation.rules.config.path=payroll-quality-rules-config.json
validation.rules.cache.enabled=true
validation.rules.cache.ttl.seconds=300
validation.rules.parallel.execution=true
validation.rules.fail.fast.critical=false

# Performance requirements
validation.max.latency.ms=50
validation.throughput.target.records.per.second=10000

# Rule-specific settings
validation.rule.employee.id.uniqueness.window.hours=1
validation.rule.ssn.blacklist.enabled=true
validation.rule.duplicate.detection.window.hours=1
validation.rule.age.range.min=16
validation.rule.age.range.max=75
validation.rule.hourly.rate.min.cents=725
validation.rule.hourly.rate.max.cents=15000

# ===================================================================
# PII ENCRYPTION AND COMPLIANCE
# ===================================================================
# Encryption configuration
pii.encryption.enabled=true
pii.encryption.algorithm=AES-256-GCM
pii.encryption.key.rotation.days=90
pii.encryption.key.provider=local
pii.encryption.key.store.path=file:///opt/payroll-pipeline/keys/

# PII field identification
pii.fields=ssn,email
pii.encryption.fields=ssn
pii.masking.fields=

# Compliance audit settings
compliance.audit.enabled=true
compliance.audit.retention.days=2555
compliance.audit.pii.access.logging=true
compliance.audit.user.tracking=true

# Access control
compliance.access.control.enabled=true
compliance.access.roles.admin=payroll-admin,compliance-officer
compliance.access.roles.viewer=hr-manager,payroll-processor

# ===================================================================
# HR WORKFLOW INTEGRATION
# ===================================================================
# HR system integration
hr.workflow.enabled=true
hr.workflow.api.base.url=http://localhost:8090/hr-api
hr.workflow.api.timeout.seconds=30
hr.workflow.api.retry.attempts=3

# Error categorization and priority mapping
hr.workflow.priority.regulatory=CRITICAL
hr.workflow.priority.business=HIGH
hr.workflow.priority.informational=MEDIUM

# Correction time estimates (minutes)
hr.workflow.correction.time.format=5
hr.workflow.correction.time.range=10
hr.workflow.correction.time.compliance=30
hr.workflow.correction.time.uniqueness=60
hr.workflow.correction.time.completeness=15

# Notification settings
hr.workflow.notifications.enabled=true
hr.workflow.notifications.slack.webhook.url=
hr.workflow.notifications.email.smtp.host=localhost
hr.workflow.notifications.email.smtp.port=587

# ===================================================================
# FLINK CONFIGURATION
# ===================================================================
# Checkpointing
flink.checkpointing.enabled=true
flink.checkpointing.interval.ms=10000
flink.checkpointing.mode=EXACTLY_ONCE
flink.checkpointing.timeout.ms=60000
flink.checkpointing.max.concurrent=1
flink.checkpointing.min.pause.between.ms=5000

# State backend
flink.state.backend=filesystem
flink.state.checkpoints.dir=file:///checkpoints
flink.state.savepoints.dir=file:///savepoints

# Restart strategy
flink.restart.strategy=fixed-delay
flink.restart.strategy.fixed-delay.attempts=3
flink.restart.strategy.fixed-delay.delay.seconds=10

# Parallelism and resources
flink.parallelism.default=4
flink.parallelism.payroll.validation=6
flink.parallelism.hr.routing=2
flink.parallelism.iceberg.sink=4

# Memory configuration
flink.taskmanager.memory.process.size=1728m
flink.taskmanager.memory.flink.size=1280m
flink.taskmanager.numberOfTaskSlots=4

# ===================================================================
# MONITORING AND METRICS
# ===================================================================
# Metrics configuration
metrics.enabled=true
metrics.reporter=prometheus
metrics.reporter.prometheus.host=localhost
metrics.reporter.prometheus.port=9249
metrics.reporter.prometheus.class=org.apache.flink.metrics.prometheus.PrometheusReporter

# Custom payroll metrics
metrics.payroll.records.processed.enabled=true
metrics.payroll.validation.latency.enabled=true
metrics.payroll.rule.performance.enabled=true
metrics.pii.access.tracking.enabled=true
metrics.hr.workflow.efficiency.enabled=true

# Alerting thresholds
metrics.alert.validation.failure.rate.threshold=0.05
metrics.alert.processing.latency.threshold.ms=100
metrics.alert.pii.violation.threshold=1
metrics.alert.hr.correction.sla.threshold.hours=24

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
# Structured logging
logging.level.root=INFO
logging.level.com.flinkpipeline.payroll=DEBUG
logging.level.org.apache.flink=WARN
logging.level.org.apache.kafka=WARN

# Compliance logging
logging.compliance.enabled=true
logging.compliance.pii.access=true
logging.compliance.audit.trail=true
logging.compliance.correlation.id.enabled=true

# Log output
logging.appender.console.enabled=true
logging.appender.file.enabled=true
logging.appender.file.path=/opt/payroll-pipeline/logs/payroll-pipeline.log
logging.appender.file.max.size=100MB
logging.appender.file.max.history=30

# ===================================================================
# DEVELOPMENT AND TESTING
# ===================================================================
# Development mode settings
development.mode=false
development.test.data.generation.enabled=false
development.test.data.rate=10
development.mock.hr.api=false
development.skip.encryption=false

# Testing configuration
test.containers.enabled=false
test.embedded.kafka.enabled=false
test.embedded.s3.enabled=false
test.data.cleanup.enabled=true

# ===================================================================
# SECURITY
# ===================================================================
# SSL/TLS configuration
security.ssl.enabled=false
security.ssl.keystore.path=
security.ssl.keystore.password=
security.ssl.truststore.path=
security.ssl.truststore.password=

# Authentication
security.authentication.enabled=false
security.authentication.method=none
security.kerberos.principal=
security.kerberos.keytab=

# Network security
security.network.allow.hosts=localhost,127.0.0.1
security.network.deny.hosts=

# ===================================================================
# PERFORMANCE TUNING
# ===================================================================
# Throughput optimization
performance.throughput.optimization.enabled=true
performance.batch.size=1000
performance.flush.interval.ms=5000
performance.compression.enabled=true

# Memory management
performance.memory.fraction=0.8
performance.memory.spill.enabled=true
performance.memory.off.heap.enabled=false

# Network optimization
performance.network.buffer.size=32768
performance.network.buffers.per.channel=8
performance.network.credit.model=true