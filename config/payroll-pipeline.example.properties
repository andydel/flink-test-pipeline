# Payroll Data Quality Pipeline - Example Configuration
# Copy this file to config/payroll-pipeline.properties and customize for your environment

# ===================================================================
# KAFKA CONFIGURATION - CUSTOMIZE FOR YOUR ENVIRONMENT
# ===================================================================
kafka.bootstrap.servers=your-kafka-broker:9092
# For Confluent Cloud:
# kafka.bootstrap.servers=your-cluster.kafka.confluent.cloud:9092
# kafka.security.protocol=SASL_SSL
# kafka.sasl.mechanism=PLAIN
# kafka.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="YOUR_API_KEY" password="YOUR_API_SECRET";

# ===================================================================
# SCHEMA REGISTRY - CUSTOMIZE FOR YOUR ENVIRONMENT
# ===================================================================
schema.registry.url=http://your-schema-registry:8081
# For Confluent Cloud:
# schema.registry.url=https://your-sr-cluster.confluent.cloud
# schema.registry.basic.auth.user.info=YOUR_SR_API_KEY:YOUR_SR_API_SECRET

# ===================================================================
# AWS S3 CONFIGURATION - CUSTOMIZE FOR YOUR ENVIRONMENT
# ===================================================================
# Production S3 settings
aws.access.key.id=YOUR_AWS_ACCESS_KEY_ID
aws.secret.access.key=YOUR_AWS_SECRET_ACCESS_KEY
aws.region=us-east-1
# Remove for production (only for LocalStack):
# aws.s3.endpoint=http://localhost:4566

iceberg.catalog.warehouse=s3a://your-payroll-data-bucket/

# ===================================================================
# PII ENCRYPTION - PRODUCTION SECURITY SETTINGS
# ===================================================================
# IMPORTANT: Use proper key management in production
pii.encryption.key.provider=aws-kms
# pii.encryption.key.provider=vault
# pii.encryption.key.provider=local

# For AWS KMS:
pii.encryption.kms.key.id=arn:aws:kms:us-east-1:123456789012:key/12345678-1234-1234-1234-123456789012

# For HashiCorp Vault:
# pii.encryption.vault.url=https://your-vault:8200
# pii.encryption.vault.token=YOUR_VAULT_TOKEN

# For local development only:
pii.encryption.key.store.path=file:///opt/payroll-pipeline/keys/

# ===================================================================
# HR WORKFLOW INTEGRATION - CUSTOMIZE FOR YOUR HR SYSTEM
# ===================================================================
hr.workflow.api.base.url=https://your-hr-system.com/api
hr.workflow.api.token=YOUR_HR_API_TOKEN

# Slack notifications (optional)
hr.workflow.notifications.slack.webhook.url=https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK

# Email notifications
hr.workflow.notifications.email.smtp.host=your-smtp-server.com
hr.workflow.notifications.email.smtp.port=587
hr.workflow.notifications.email.smtp.username=your-smtp-username
hr.workflow.notifications.email.smtp.password=your-smtp-password

# ===================================================================
# COMPLIANCE AND SECURITY - PRODUCTION SETTINGS
# ===================================================================
# Compliance officer contacts
compliance.audit.officer.email=compliance@yourcompany.com
compliance.audit.escalation.email=legal@yourcompany.com

# Access control - customize roles for your organization
compliance.access.roles.admin=payroll-admin,compliance-officer,data-protection-officer
compliance.access.roles.viewer=hr-manager,payroll-processor,audit-team

# ===================================================================
# MONITORING - CUSTOMIZE FOR YOUR INFRASTRUCTURE
# ===================================================================
# Prometheus metrics
metrics.reporter.prometheus.host=your-prometheus-server
metrics.reporter.prometheus.port=9090

# Grafana dashboards (if using)
monitoring.grafana.url=https://your-grafana.com
monitoring.grafana.dashboard.payroll=payroll-pipeline-dashboard

# ===================================================================
# PERFORMANCE TUNING - ADJUST BASED ON YOUR WORKLOAD
# ===================================================================
# Adjust based on expected payroll processing volume
validation.throughput.target.records.per.second=5000
flink.parallelism.payroll.validation=4
kafka.topic.payroll.input.partitions=4

# Memory settings - adjust based on your Flink cluster
flink.taskmanager.memory.process.size=2048m
flink.taskmanager.numberOfTaskSlots=2

# ===================================================================
# ENVIRONMENT-SPECIFIC OVERRIDES
# ===================================================================
# Development environment
# development.mode=true
# development.test.data.generation.enabled=true
# development.mock.hr.api=true

# Staging environment
# validation.max.latency.ms=100
# hr.workflow.notifications.enabled=false

# Production environment
# validation.max.latency.ms=50
# compliance.audit.enabled=true
# pii.encryption.enabled=true
# hr.workflow.notifications.enabled=true